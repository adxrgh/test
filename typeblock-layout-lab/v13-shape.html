<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TypeBlock Shape Lab V13</title><style>
:root{--bg:#ecece7;--paper:#fbfbf7;--ink:#11110f;--muted:#77776f;--line:#c8c8c0;--signal:#ff4b00;--g:12px}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}button,textarea,input{font:inherit;color:inherit}.app{max-width:1120px;margin:auto;padding:16px}.head{display:flex;justify-content:space-between;align-items:end;border-bottom:4px solid;padding:8px 0 14px}.head h1{margin:0;font-size:30px;line-height:.9;letter-spacing:-.055em}.head small{color:var(--muted);letter-spacing:.08em}.cols{display:grid;grid-template-columns:330px 1fr;gap:22px;margin-top:18px}.controls{display:grid;gap:14px;align-content:start}.panel{border-top:1px solid;padding-top:10px}.panel h2{font-size:12px;margin:0 0 8px}.hint{font-size:10px;line-height:1.45;color:var(--muted)}textarea{width:100%;min-height:170px;border:1px solid;border-radius:0;background:white;padding:8px;font-size:11px;line-height:1.4}.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}.row button{border:0;border-bottom:1px solid;background:none;padding:2px 0;font-weight:700}.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.ladder div{border-top:1px solid var(--line);padding-top:4px;font-size:9px;color:var(--muted);cursor:pointer}.ladder b{display:block;color:var(--ink);font-size:10px}.decision{font-size:10px;color:var(--muted)}.decision strong{color:var(--ink)}table{width:100%;border-collapse:collapse;font-size:9px;margin-top:6px}th,td{padding:4px 2px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}tr.sel{color:var(--signal);font-weight:800}tr.no{opacity:.32}.stage{background:var(--paper);border:1px solid;overflow:hidden}.stagehead{position:sticky;top:0;z-index:10;background:rgba(251,251,247,.96);border-bottom:1px solid;padding:10px 12px;display:flex;justify-content:space-between}.stagehead span{font-size:9px;color:var(--muted)}#layout{position:relative;min-height:820px;background-image:linear-gradient(to bottom,transparent 7px,rgba(17,17,15,.04) 8px);background-size:100% 8px}.block{position:absolute;padding:8px 10px;overflow:hidden;cursor:pointer}.block.active{box-shadow:inset 0 0 0 1px var(--signal)}.meta{font-size:8px;letter-spacing:.07em;color:var(--muted);margin-bottom:6px}.meta b{color:var(--signal)}.body{font-size:13.5px;line-height:1.48;font-weight:560;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}.seq{position:absolute;left:0;bottom:0;font-size:62px;line-height:.72;font-weight:800;letter-spacing:-.07em;color:rgba(17,17,15,.09);pointer-events:none}.cue{font-size:10px;line-height:1.4;font-style:italic;color:#555;margin-top:6px}.clean .meta,.clean .debug{display:none}.cands{display:flex;gap:8px;overflow:auto;padding:10px 0}.cands button{flex:0 0 auto;border:1px solid var(--line);background:none;padding:6px 9px;font-size:10px}.cands button.on{border-color:var(--signal);color:var(--signal)}.stats{font-size:10px;color:var(--muted);white-space:pre-wrap;border-top:1px solid var(--line);padding-top:8px}.opts{display:flex;gap:12px;flex-wrap:wrap;font-size:11px}.why{margin-top:7px;color:var(--ink);font-size:10px;line-height:1.35}@media(max-width:760px){.cols{grid-template-columns:1fr}.controls{order:2}.view{order:1}.app{padding:10px}.head h1{font-size:26px}.ladder{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main class="app" id="app"><header class="head"><h1>TypeBlock<br>Shape Lab</h1><small>area → intrinsic shape → context → stability</small></header><div class="cols"><section class="controls"><div class="panel"><h2>Article size ladder</h2><div class="ladder" id="ladder"></div></div><div class="panel"><h2>Shape decision</h2><div id="decision" class="decision"></div><p class="hint">Click any block. The text chooses a preferred reading shape first; the viewport may bend it; previous placement resists unnecessary change.</p></div><div class="panel"><h2>Content</h2><textarea id="src"></textarea><div class="row"><button id="apply">Apply</button><button id="random">Random</button><button id="reset">Reset</button></div></div><div class="panel"><h2>Options</h2><div class="opts"><label><input id="full" type="checkbox" checked> 6-col</label><label><input id="clean" type="checkbox"> clean</label><label><input id="bounds" type="checkbox"> bounds</label></div></div></section><section class="view"><div class="stage"><div class="stagehead"><b>Typeblock / Layout</b><span id="meta"></span></div><div id="layout"></div></div><div class="cands" id="cands"></div><div class="stats" id="stats"></div></section></div></main><script>(()=>{'use strict';const COLS=6,U=8,G=12,BAND=60,LENS=[60,180,420,900,1800,3600,7200,12000];const TOP=['Spatial position becomes part of memory when a layout remains stable enough to be learned.','Whitespace is pacing rather than waste. Complete open fields can separate groups while small accidental holes become noise.','Sequence numbers separate reading order from placement, allowing asymmetry without losing direction.','Processed traces surface inside source text instead of becoming separate cards.','A Page begins with selection, arrangement, and writing while references retain provenance.','Panorama changes density rather than identity and preserves grouping, order, adjacency, and representative cues.','Area and shape are separate variables. Source length determines territory weight while the solver chooses width and height.','Local reflow should preserve spatial memory and resist rebuilding the whole page.'];function article(seed,n){let s='',i=0;while(s.length<n){s+=(s?' In practice, ':'')+TOP[(seed+i)%TOP.length];i++}return s.slice(0,n)}function sample(){return LENS.map((n,i)=>article(i,n)+(i==2||i==6?'\n@cue '+(i==2?'Processing changes visibility, not source identity.':'Length determines territory; layout determines shape.'):'')+(i==5?'\n@pin right':'')).join('\n---\n')}const SAMPLE=sample(),$=id=>document.getElementById(id);$('src').value=SAMPLE;let entries=[],cands=[],sel=0,active=1,previous=new Map();function area(n){return Math.max(18,Math.min(170,Math.round(10+Math.sqrt(Math.max(1,n))*1.46)))}function parse(t){return t.split(/\n\s*---\s*\n/).map((c,i)=>{let cue='',pin=null,b=[];c.trim().split(/\n/).forEach(x=>{if(/^@cue\s+/i.test(x))cue=x.replace(/^@cue\s+/i,'');else if(/^@pin\s+/i.test(x))pin=x.replace(/^@pin\s+/i,'').trim();else b.push(x)});let body=b.join(' ').trim();return body?{id:i+1,body,cue,pin,chars:body.length,target:area(body.length)}:null}).filter(Boolean)}function rows(e,span){return Math.max(4,Math.round(e.target/span))}function overlap(a,b){return !(a.x+a.span<=b.x||b.x+b.span<=a.x||a.row+a.rows<=b.row||b.row+b.rows<=a.row)}function avgChar(){if(avgChar.v)return avgChar.v;let c=document.createElement('canvas').getContext('2d');c.font='560 13.5px Helvetica Neue,Arial';let s='abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ 0123456789';return avgChar.v=c.measureText(s).width/s.length}function widthPx(span){let w=Math.max(300,$('layout').clientWidth||650),cw=(w-G*(COLS-1))/COLS;return cw*span+G*(span-1)-20}function shape(e,span){let r=rows(e,span),w=widthPx(span),h=Math.max(28,r*U-15),cpl=Math.max(8,w/avgChar()),full=Math.max(1,Math.ceil(e.chars/cpl)),avail=Math.max(1,(h-20-(e.cue?38:0))/20),fill=Math.min(1,full/avail),line=0;if(cpl<26)line=(26-cpl)*3.2;else if(cpl>58)line=(cpl-58)*2.2;let ar=w/h,aspect=ar<.68?(.68-ar)*85:ar>4.4?(ar-4.4)*12:0,density=fill<.55?(.55-fill)*135:fill<.68?(.68-fill)*28:0,intr=Math.min(100,line*.5+aspect*.3+density*.2),tone=span<=3?'Column / Reading':span==4?'Body / Neutral':span==5?'Wide / Editorial':'Statement / Horizontal';return{span,rows:r,cpl,fill,ar,intr,tone}}function placeOptions(e,st){let out=[];for(let span=2;span<=COLS;span++){if(span==6&&!$('full').checked)continue;let r=rows(e,span);for(let row=st.cursor;row<=st.cursor+18;row++)for(let x=0;x<=COLS-span;x++){let p={id:e.id,x,row,span,rows:r};if(st.ps.some(q=>overlap(p,q)))continue;if(e.pin=='left'&&x>1)continue;if(e.pin=='right'&&x+span<COLS-1)continue;out.push(p)}}return out.slice(0,44)}function inter(p,a,b){return Math.max(0,Math.min(p.row+p.rows,b)-Math.max(p.row,a))}function context(p,ps,i){let c=p.row+p.rows/2,a=Math.max(0,Math.floor(c-BAND/2)),b=a+BAND,act=ps.map((q,j)=>({q,j,m:inter(q,a,b)*q.span})).filter(v=>v.m>0),axis=16;for(let v of act){if(v.j==i)continue;if(v.q.x==p.x||v.q.x+v.q.span==p.x+p.span){axis=0;break}if(Math.abs(v.q.x-p.x)<=1)axis=Math.min(axis,7)}let edge=(p.x==0||p.x+p.span==COLS)?0:12,rhythm=0;if(i>0&&ps[i-1]?.span==p.span)rhythm+=7;if(i+1<ps.length&&ps[i+1]?.span==p.span)rhythm+=7;let masses=act.map(v=>v.m).sort((x,y)=>y-x),hier=0;if(masses.length>1){let z=masses[0]/Math.max(1,masses[1]);if(z<1.2)hier+=(1.2-z)*40}return Math.min(100,axis+edge+rhythm+hier)}function stay(p){let q=previous.get(p.id);return q?Math.min(100,Math.abs(q.x-p.x)*15+Math.abs(q.row-p.row)*2.2+Math.abs(q.span-p.span)*11+Math.abs(q.rows-p.rows)*1.2):0}function parts(e,p,ps,i){let s=shape(e,p.span),ctx=context(p,ps,i),st=stay(p),final=(5*s.intr+3*ctx+8*st)/16;return{...s,ctx,st,final}}function layoutScore(ps){let intr=0,ctx=0,st=0,areaDrift=0,mass=0,mx=0,fullrun=0;ps.forEach((p,i)=>{let z=parts(entries[i],p,ps,i),a=p.span*p.rows;intr+=z.intr;ctx+=z.ctx;st+=z.st;areaDrift+=Math.abs(a-entries[i].target)/entries[i].target*100;mass+=a;mx+=(p.x+p.span/2)*a});for(let i=1;i<ps.length;i++)if(ps[i].span==6&&ps[i-1].span==6)fullrun+=18;let balance=mass?Math.abs(mx/mass-3)*10:0,score=(5*intr/ps.length+3*ctx/ps.length+8*st/ps.length)/16+areaDrift/ps.length*.5+balance+fullrun;return{score,intr:intr/ps.length,ctx:ctx/ps.length,st:st/ps.length,area:areaDrift/ps.length,balance,fullrun}}function generate(){let beam=[{i:0,cursor:0,ps:[]}],bw=72;while(beam.some(s=>s.i<entries.length)){let next=[];for(let st of beam){if(st.i>=entries.length){next.push(st);continue}for(let p of placeOptions(entries[st.i],st)){let ps=[...st.ps,p],m=layoutScore(ps);next.push({i:st.i+1,cursor:Math.max(st.cursor,p.row),ps,m,s:m.score})}}next.sort((a,b)=>a.s-b.s);beam=next.slice(0,bw)}cands=beam.filter(s=>s.i==entries.length).sort((a,b)=>a.s-b.s).slice(0,8);sel=0;render()}function alternatives(i,ps){let e=entries[i],cur=ps[i],other=ps.filter((_,j)=>j!=i),out=[];for(let span=2;span<=COLS;span++){if(span==6&&!$('full').checked){out.push({span,legal:false});continue}let r=rows(e,span),best=null;for(let row=Math.max(0,cur.row-7);row<=cur.row+9;row++)for(let x=0;x<=COLS-span;x++){let p={id:e.id,x,row,span,rows:r};if(other.some(q=>overlap(p,q)))continue;if(e.pin=='left'&&x>1)continue;if(e.pin=='right'&&x+span<COLS-1)continue;let t=[...ps];t[i]=p,z=parts(e,p,t,i);if(!best||z.final<best.final)best={...z,p,legal:true}}out.push(best||{span,legal:false,...shape(e,span)})}return out}function decision(ps){let i=Math.max(0,entries.findIndex(e=>e.id==active)),e=entries[i],p=ps[i],alts=alternatives(i,ps),z=parts(e,p,ps,i),pref=[...alts].filter(x=>x.legal).sort((a,b)=>a.intr-b.intr)[0],why=[];if(pref?.span==p.span)why.push('matches intrinsic reading preference');else if(pref)why.push(`context bends ${pref.span}→${p.span} columns`);if(z.ctx<12)why.push('shares strong local axes');if(previous.has(e.id)&&z.st<4)why.push('preserves previous placement');if(z.fill>.72)why.push(`${Math.round(z.fill*100)}% text fill`);$('decision').innerHTML=`<strong>${String(e.id).padStart(2,'0')} · ${e.chars.toLocaleString()} chars · ${z.tone}</strong><div>selected ${p.span}×${p.rows} · intrinsic ${z.intr.toFixed(1)} · context ${z.ctx.toFixed(1)} · stability ${z.st.toFixed(1)}</div><table><thead><tr><th>shape</th><th>line</th><th>fill</th><th>intr</th><th>ctx</th><th>stay</th><th>final</th></tr></thead><tbody>${alts.map(a=>a.legal?`<tr class="${a.span==p.span?'sel':''}"><td>${a.span}×${a.rows}</td><td>${Math.round(a.cpl)}</td><td>${Math.round(a.fill*100)}%</td><td>${a.intr.toFixed(1)}</td><td>${a.ctx.toFixed(1)}</td><td>${a.st.toFixed(1)}</td><td>${a.final.toFixed(1)}</td></tr>`:`<tr class="no"><td>${a.span} col</td><td colspan="6">no legal placement nearby</td></tr>`).join('')}</tbody></table><div class="why">Why: ${why.length?why.join('; '):'lowest legal combined cost'}.</div>`}function ladder(){let h=$('ladder');h.innerHTML='';entries.forEach(e=>{let d=document.createElement('div');d.innerHTML=`<b>${String(e.id).padStart(2,'0')} · ${e.chars.toLocaleString()}</b>area ${e.target}`;d.onclick=()=>{active=e.id;render()};h.appendChild(d)})}function render(){if(!cands.length)return;let c=cands[sel],L=$('layout');L.innerHTML='';$('app').classList.toggle('clean',$('clean').checked);let max=Math.max(...c.ps.map(p=>p.row+p.rows))+5;L.style.height=max*U+'px';c.ps.forEach((p,i)=>{let e=entries[i],z=parts(e,p,c.ps,i),d=document.createElement('article');d.className='block'+(e.id==active?' active':'');if($('bounds').checked)d.style.outline='1px solid rgba(255,75,0,.45)';d.style.left=`calc(${p.x/COLS*100}% + ${p.x?G/2:0}px)`;d.style.width=`calc(${p.span/COLS*100}% - ${p.x?G/2:0}px)`;d.style.top=p.row*U+'px';d.style.height=p.rows*U+'px';let lines=Math.max(2,Math.floor((p.rows*U-($('clean').checked?10:28)-(e.cue?38:0))/20));d.innerHTML=`<div class="meta">${p.span}×${p.rows} · fill <b>${Math.round(z.fill*100)}%</b> · intr ${z.intr.toFixed(0)} · ctx ${z.ctx.toFixed(0)}</div><div class="body" style="-webkit-line-clamp:${lines}">${e.body}</div>${e.cue?`<div class="cue">${e.cue}</div>`:''}<div class="seq">${String(e.id).padStart(2,'0')}</div>`;d.onclick=()=>{active=e.id;render()};L.appendChild(d)});decision(c.ps);$('meta').textContent=`${entries.length} articles · candidate ${sel+1}`;$('stats').textContent=`intrinsic ${c.m.intr.toFixed(1)} · context ${c.m.ctx.toFixed(1)} · stability ${c.m.st.toFixed(1)} · area drift ${c.m.area.toFixed(1)} · score ${c.m.score.toFixed(1)}`;let C=$('cands');C.innerHTML='';cands.forEach((q,i)=>{let b=document.createElement('button');b.className=i==sel?'on':'';b.textContent=`#${i+1} · ${q.s.toFixed(1)}`;b.onclick=()=>{sel=i;render()};C.appendChild(b)})}function apply(preserve=true){if(preserve&&cands[sel])previous=new Map(cands[sel].ps.map(p=>[p.id,p]));else previous=new Map();entries=parse($('src').value);ladder();generate()}function randomize(){let ls=[45,110,260,600,1300,2600,5200,10000];$('src').value=ls.map((n,i)=>article((i+3)%TOP.length,n)).join('\n---\n');apply(false)}$('apply').onclick=()=>apply(true);$('reset').onclick=()=>{$('src').value=SAMPLE;apply(false)};$('random').onclick=randomize;$('full').onchange=()=>apply(true);$('clean').onchange=render;$('bounds').onchange=render;apply(false)})();</script></body></html>
