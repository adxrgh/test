<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TypeBlock Layout Lab</title><style>:root{--bg:#ecece7;--paper:#fbfbf7;--ink:#11110f;--muted:#77776f;--line:#c8c8c0;--signal:#ff4b00}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,textarea,input,select{font:inherit;color:inherit}.app{max-width:1040px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;align-items:end;border-bottom:4px solid;padding:8px 0 14px;margin-bottom:18px}.head h1{margin:0;font-size:30px;line-height:.9;letter-spacing:-.05em}.head small,.hint,.stats{color:var(--muted)}.controls{display:grid;gap:14px;margin-bottom:18px}.panel{border-top:1px solid;padding-top:12px}.panel h2{font-size:12px;margin:0 0 8px}.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.ladder div{border-top:1px solid var(--line);padding-top:5px;font-size:9px;color:var(--muted)}.ladder b{display:block;color:var(--ink);font-size:11px}textarea{width:100%;min-height:220px;border:1px solid;border-radius:0;background:#fff;padding:10px;font-size:12px;line-height:1.45}.row{display:flex;flex-wrap:wrap;gap:12px;margin-top:9px}.row button{border:0;border-bottom:1px solid;background:none;padding:3px 0;font-weight:700}.weights{display:grid;gap:7px}.w{display:grid;grid-template-columns:1fr 95px 28px;gap:7px;align-items:center;font-size:11px}.w input{width:100%}.w output{text-align:right;font-weight:800}.options{display:flex;flex-wrap:wrap;gap:12px 18px;font-size:12px}.stage{background:var(--paper);border:1px solid;position:relative;overflow:hidden}.stagehead{position:sticky;top:0;z-index:20;background:rgba(251,251,247,.96);border-bottom:1px solid;padding:12px 14px;display:flex;justify-content:space-between}.stagehead span{font-size:10px;color:var(--muted)}#layout{position:relative;min-height:900px;padding:18px 0 56px;background-image:linear-gradient(to bottom,transparent 7px,rgba(17,17,15,.045) 8px);background-size:100% 8px}.grid{position:absolute;inset:18px 0 56px;display:grid;grid-template-columns:repeat(6,1fr);gap:12px;pointer-events:none;opacity:0}.showgrid .grid{opacity:1}.grid i{border-left:1px solid rgba(255,75,0,.2)}.block{position:absolute;padding:0 10px;overflow:hidden}.cluster{position:relative;z-index:2}.cluster.low{position:absolute;left:10px;right:10px;bottom:58px}.body{font-size:15px;line-height:1.48;font-weight:560;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}.meta{font-size:8px;line-height:1.3;letter-spacing:.08em;color:var(--muted);margin-bottom:8px}.meta strong{color:var(--signal)}.cue{font-size:11px;line-height:1.45;font-style:italic;color:#555;margin-top:7px}.seq{position:absolute;left:0;bottom:0;font-size:62px;line-height:.72;font-weight:800;letter-spacing:-.07em;color:rgba(17,17,15,.10);pointer-events:none;z-index:1}.debug .block{outline:1px solid rgba(255,75,0,.4)}.candidates{display:flex;gap:8px;overflow:auto;padding:12px 0}.candidate{flex:0 0 auto;border:1px solid var(--line);background:transparent;padding:8px 10px;font-size:11px}.candidate.active{border-color:var(--signal);color:var(--signal)}.stats{font-size:11px;white-space:pre-wrap;border-top:1px solid var(--line);padding-top:10px}.hint{font-size:11px;line-height:1.5}@media(min-width:760px){.app{display:grid;grid-template-columns:320px 1fr;gap:24px}.head{grid-column:1/-1}.controls{position:sticky;top:12px;align-self:start;max-height:calc(100vh - 40px);overflow:auto}}@media(max-width:759px){.app{padding:12px}.head h1{font-size:26px}.controls{order:2}.stage{order:1}.ladder{grid-template-columns:repeat(2,1fr)}.body{font-size:14px}}</style></head><body><main class="app"><header class="head"><h1>TypeBlock<br>Layout Lab</h1><small>6-column / area conserved</small></header><section class="controls"><div class="panel"><h2>Article size ladder</h2><div class="ladder" id="ladder"></div></div><div class="panel"><h2>Content</h2><textarea id="src"></textarea><div class="row"><button id="apply">Apply</button><button id="random">Random</button><button id="reset">Reset</button></div><p class="hint">Large blocks keep a visible projection near their sequence marker so their territory never reads as empty.</p></div><div class="panel"><h2>Weights</h2><div class="weights" id="weights"></div></div><div class="panel"><h2>Options</h2><div class="options"><label><input id="full" type="checkbox" checked> allow 6-col</label><label><input id="grid" type="checkbox"> grid</label><label><input id="debug" type="checkbox"> bounds</label><label>candidates <select id="count"><option>4</option><option selected>8</option><option>12</option></select></label></div></div></section><section><div class="stage"><div class="stagehead"><b>Typeblock / Layout</b><span id="meta"></span></div><div id="layout"><div class="grid" id="gridlines"></div></div></div><div class="candidates" id="candidates"></div><div class="stats" id="stats"></div></section></main><script>(()=>{'use strict';const COLS=6,U=8,G=12;const SAMPLE=`A note can be tiny and still belong to the same reading field.\n@length 60\n---\nSequence numbers let spatial order stay flexible without losing reading order.\n@cue Reading order is explicit.\n@length 180\n---\nProcessed traces should surface inside the original source territory rather than becoming separate cards. A highlight or explanation changes what becomes visible, not how much source material exists.\n@length 420\n---\nPanorama is not a screenshot scaled down. It compresses whitespace, reduces ordinary text, and keeps sequence, grouping, hierarchy, adjacency, and representative cues. Standard view shows composition; panorama shows path.\n@cue Scale changes the projection, not the identity of the block.\n@length 900\n---\nA Page begins with selection, arrangement, and writing. The reader gathers material from existing text, removes what is unnecessary, places references into a new composition, and writes new passages around them.\n@length 1800\n---\nA long article should retain a strong sense of volume when it enters Layout, but volume must not force one particular width. The same article may become narrow and tall, medium and balanced, or full-width and shallow while preserving approximately the same territory area.\n@pin right\n@length 3600\n---\nVery long source material makes the distinction between area and shape especially important. Full source volume is measured first, mapped through a nonlinear territory function, and then expressed through multiple legal width-height combinations on the grid. The solver chooses among those shapes according to reading path, edge anchors, whitespace quality, line length, balance, previous placement, and repetition costs.\n@cue Length determines territory; layout determines shape.\n@length 7200\n---\nAn extremely long article is useful as a stress test because it should be visibly heavier than every short note around it while still remaining a participant in the editorial composition rather than taking over the entire page. Its target area should grow clearly beyond medium and long entries, yet the growth should be sublinear.\n@length 12000`;const W={move:80,edge:48,fragment:38,line:35,balance:24,fullrun:44,area:85};let weights={...W},entries=[],cands=[],selected=0,previous=new Map();const $=id=>document.getElementById(id);$('src').value=SAMPLE;for(let i=0;i<COLS;i++)$('gridlines').appendChild(document.createElement('i'));function targetArea(chars){return Math.max(18,Math.min(170,Math.round(10+Math.sqrt(Math.max(1,chars))*1.46)))}function parse(t){return t.split(/\n\s*---\s*\n/).map((c,i)=>{let cue='',pin=null,len=null,b=[];c.trim().split(/\n/).forEach(x=>{if(/^@cue\s+/i.test(x))cue=x.replace(/^@cue\s+/i,'');else if(/^@pin\s+/i.test(x))pin=x.replace(/^@pin\s+/i,'').trim();else if(/^@length\s+/i.test(x))len=+x.replace(/^@length\s+/i,'');else b.push(x)});let body=b.join(' ').trim();if(!body)return null;let chars=len||body.length;return{id:i+1,body,cue,pin,chars,target:targetArea(chars)}}).filter(Boolean)}function rowsFor(e,span){return Math.max(4,Math.round(e.target/span))}function overlap(a,b){return !(a.x+a.span<=b.x||b.x+b.span<=a.x||a.row+a.rows<=b.row||b.row+b.rows<=a.row)}function placementsFor(e,state){let out=[];for(let span=2;span<=COLS;span++){if(span===6&&!$('full').checked)continue;let rows=rowsFor(e,span);for(let row=state.cursor;row<=state.cursor+20;row++)for(let x=0;x<=COLS-span;x++){let p={id:e.id,x,row,span,rows};if(state.ps.some(q=>overlap(p,q)))continue;if(e.pin==='left'&&x>1)continue;if(e.pin==='right'&&x+span<COLS-1)continue;out.push(p)}}return out.slice(0,42)}function metric(ps){let area=0,edge=0,line=0,balance=0,fullrun=0,move=0,mass=0,mx=0;ps.forEach((p,i)=>{let e=entries[i],actual=p.span*p.rows;area+=Math.abs(actual-e.target)/e.target*100;if(p.x!==0&&p.x+p.span!==COLS)edge+=24;let ideal=e.chars>7000?5:e.chars>3000?4.5:e.chars>1200?4:e.chars>500?3.5:e.chars>150?3:2.4;line+=Math.abs(p.span-ideal)*9;mass+=actual;mx+=(p.x+p.span/2)*actual;let prev=previous.get(p.id);if(prev)move+=Math.abs(prev.x-p.x)*9+Math.abs(prev.row-p.row)*1.2+Math.abs(prev.span-p.span)*5});for(let i=1;i<ps.length;i++)if(ps[i].span===6&&ps[i-1].span===6)fullrun+=35;balance=mass?Math.abs(mx/mass-3)*13:0;let maxRow=Math.max(...ps.map(p=>p.row+p.rows)),occupied=ps.reduce((s,p)=>s+p.span*p.rows,0),fragment=Math.max(0,(1-occupied/Math.max(1,maxRow*COLS))*28-5);return{area:area/ps.length,edge:edge/ps.length,line:line/ps.length,balance,fullrun,move:move/ps.length,fragment}}function score(m){let sw=0,s=0;Object.keys(W).forEach(k=>{sw+=weights[k];s+=m[k]*weights[k]});return s/sw}function generate(){let beam=[{i:0,cursor:0,ps:[]}],bw=80;while(beam.some(s=>s.i<entries.length)){let next=[];for(let st of beam){if(st.i>=entries.length){next.push(st);continue}for(let p of placementsFor(entries[st.i],st)){let ps=[...st.ps,p];next.push({i:st.i+1,cursor:Math.max(st.cursor,p.row),ps})}}next.forEach(s=>{s.m=metric(s.ps);s.s=score(s.m)});next.sort((a,b)=>a.s-b.s);beam=next.slice(0,bw)}cands=beam.filter(s=>s.i===entries.length).sort((a,b)=>a.s-b.s).slice(0,+$('count').value);selected=0;render()}function renderLadder(){let h=$('ladder');h.innerHTML='';entries.forEach(e=>{let d=document.createElement('div');d.innerHTML=`<b>${String(e.id).padStart(2,'0')} · ${e.chars.toLocaleString()}</b>target ${e.target} cells`;h.appendChild(d)})}function render(){if(!cands.length)return;let c=cands[selected],L=$('layout');L.querySelectorAll('.block').forEach(n=>n.remove());L.classList.toggle('showgrid',$('grid').checked);L.classList.toggle('debug',$('debug').checked);let maxRow=Math.max(...c.ps.map(p=>p.row+p.rows))+6;L.style.height=maxRow*U+'px';c.ps.forEach((p,i)=>{let e=entries[i],actual=p.span*p.rows,delta=Math.round((actual-e.target)/e.target*100),d=document.createElement('article');d.className='block';d.style.left=`calc(${p.x/COLS*100}% + ${p.x?G/2:0}px)`;d.style.width=`calc(${p.span/COLS*100}% - ${p.x?G/2:0}px)`;d.style.top=p.row*U+'px';d.style.height=p.rows*U+'px';let large=p.rows>=32,lines=large?Math.min(7,Math.max(3,Math.floor((p.rows*U-110)/22))):Math.max(2,Math.floor((p.rows*U-44)/22));d.innerHTML=`<div class="cluster${large?' low':''}"><div class="meta">LEN <strong>${e.chars.toLocaleString()}</strong> · TARGET <strong>${e.target}</strong> · ACTUAL ${actual} · ${p.span}×${p.rows} · Δ ${delta>0?'+':''}${delta}%</div><div class="body" style="-webkit-line-clamp:${lines}">${e.body}</div>${e.cue?`<div class="cue">${e.cue}</div>`:''}</div><div class="seq">${String(e.id).padStart(2,'0')}</div>`;L.appendChild(d)});$('meta').textContent=`${entries.length} articles / candidate ${selected+1}`;$('stats').textContent=Object.entries(c.m).map(([k,v])=>`${k}: ${v.toFixed(1)} × ${weights[k]}`).join('\n')+`\nscore: ${c.s.toFixed(2)}`;let C=$('candidates');C.innerHTML='';cands.forEach((x,i)=>{let b=document.createElement('button');b.className='candidate'+(i===selected?' active':'');b.textContent=`#${i+1} · ${x.s.toFixed(1)}`;b.onclick=()=>{selected=i;render()};C.appendChild(b)})}function apply(preserve=true){if(preserve&&cands[0])previous=new Map(cands[selected].ps.map(p=>[p.id,p]));else previous=new Map();entries=parse($('src').value);renderLadder();generate()}function weightUI(){let h=$('weights');h.innerHTML='';Object.keys(W).forEach(k=>{let d=document.createElement('label');d.className='w';d.innerHTML=`<span>${k}</span><input type="range" min="0" max="120" value="${weights[k]}"><output>${weights[k]}</output>`;let r=d.querySelector('input'),o=d.querySelector('output');r.oninput=()=>{weights[k]=+r.value;o.value=r.value;generate()};h.appendChild(d)})}function randomize(){let lengths=[45,100,220,480,1000,2200,5000,10000],s=['Spatial position can become part of memory.','Whitespace is pacing rather than waste.','A long block may become wide and shallow without changing its territory weight.','Sequence separates reading order from placement.','Processed traces should surface inside source text.','Local reflow should preserve earlier spatial memory.','A full-width shape is only one legal geometry.','Panorama compresses scale without erasing relationships.'];$('src').value=lengths.map((n,i)=>s[i]+' '+s[(i+3)%s.length]+'\n@length '+n).join('\n---\n');apply(false)}$('apply').onclick=()=>apply(true);$('reset').onclick=()=>{$('src').value=SAMPLE;apply(false)};$('random').onclick=randomize;$('full').onchange=generate;$('grid').onchange=render;$('debug').onchange=render;$('count').onchange=generate;weightUI();apply(false)})();</script></body></html>
