<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TypeBlock Layout Lab</title><style>:root{--bg:#ecece7;--paper:#fbfbf7;--ink:#11110f;--muted:#77776f;--line:#c8c8c0;--signal:#ff4b00}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,textarea,input,select{font:inherit;color:inherit}.app{max-width:980px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;align-items:end;border-bottom:4px solid var(--ink);padding:8px 0 14px;margin-bottom:18px}.head h1{margin:0;font-size:30px;line-height:.9;letter-spacing:-.05em}.head small{color:var(--muted);letter-spacing:.08em}.controls{display:grid;gap:14px;margin-bottom:18px}.panel{border-top:1px solid var(--ink);padding-top:12px}.panel h2{font-size:12px;margin:0 0 8px;letter-spacing:.04em}textarea{width:100%;min-height:180px;border:1px solid var(--ink);border-radius:0;background:white;padding:10px;font-size:13px;line-height:1.45}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:9px}.row button{border:0;border-bottom:1px solid;background:none;padding:3px 0;font-weight:700}.row button:active{color:var(--signal)}.weights{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px}.w{display:grid;grid-template-columns:1fr 95px 28px;gap:7px;align-items:center;font-size:11px}.w input{width:100%}.w output{text-align:right;font-weight:800}.options{display:flex;flex-wrap:wrap;gap:12px 18px;font-size:12px}.stage{background:var(--paper);border:1px solid var(--ink);position:relative;overflow:hidden}.stagehead{position:sticky;top:0;z-index:20;background:rgba(251,251,247,.96);border-bottom:1px solid var(--ink);padding:12px 14px;display:flex;justify-content:space-between}.stagehead b{letter-spacing:.04em}.stagehead span{font-size:10px;color:var(--muted)}#layout{position:relative;min-height:780px;padding:18px 0 56px;background-image:linear-gradient(to bottom,transparent 7px,rgba(17,17,15,.045) 8px);background-size:100% 8px}.grid{position:absolute;inset:18px 0 56px;display:grid;grid-template-columns:repeat(6,1fr);gap:12px;pointer-events:none;opacity:0}.showgrid .grid{opacity:1}.grid i{border-left:1px solid rgba(255,75,0,.2)}.block{position:absolute;padding:0 10px;overflow:visible}.body{font-size:15px;line-height:1.48;font-weight:560;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}.meta{font-size:8px;letter-spacing:.12em;color:var(--muted);margin-bottom:8px}.seq{position:absolute;left:0;bottom:0;font-size:62px;line-height:.72;font-weight:800;letter-spacing:-.07em;color:rgba(17,17,15,.10);pointer-events:none}.cue{font-size:11px;line-height:1.45;font-style:italic;color:#555;margin-top:8px}.debug .block{outline:1px solid rgba(255,75,0,.35)}.candidates{display:flex;gap:8px;overflow:auto;padding:12px 0}.candidate{flex:0 0 auto;border:1px solid var(--line);background:transparent;padding:8px 10px;font-size:11px}.candidate.active{border-color:var(--signal);color:var(--signal)}.stats{font-size:11px;color:var(--muted);white-space:pre-wrap;border-top:1px solid var(--line);padding-top:10px}.hint{font-size:11px;color:var(--muted);line-height:1.5}@media(min-width:760px){.app{display:grid;grid-template-columns:300px 1fr;gap:24px}.head{grid-column:1/-1}.controls{position:sticky;top:12px;align-self:start;max-height:calc(100vh - 40px);overflow:auto}.weights{grid-template-columns:1fr}.stage{min-height:calc(100vh - 110px)}}@media(max-width:759px){.app{padding:12px}.head h1{font-size:26px}.controls{order:2}.stage{order:1}.weights{grid-template-columns:1fr}.body{font-size:14px}}</style></head><body><main class="app"><header class="head"><h1>TypeBlock<br>Layout Lab</h1><small>6-column / area conserved</small></header><section class="controls"><div class="panel"><h2>Content</h2><textarea id="src"></textarea><div class="row"><button id="apply">Apply</button><button id="random">Random</button><button id="reset">Reset</button></div><p class="hint">Separate blocks with ---; optional @cue, @pin left/right, @length 2000.</p></div><div class="panel"><h2>Weights</h2><div class="weights" id="weights"></div></div><div class="panel"><h2>Options</h2><div class="options"><label><input id="full" type="checkbox" checked> allow 6-col</label><label><input id="grid" type="checkbox"> grid</label><label><input id="debug" type="checkbox"> bounds</label><label>candidates <select id="count"><option>4</option><option selected>8</option><option>12</option></select></label></div></div></section><section><div class="stage"><div class="stagehead"><b>Typeblock / Layout</b><span id="meta"></span></div><div id="layout"><div class="grid" id="gridlines"></div></div></div><div class="candidates" id="candidates"></div><div class="stats" id="stats"></div></section></main><script>(()=>{'use strict';const COLS=6,U=8,G=12;const SAMPLE=`Text is not content placed inside cards. It is the interface itself. Body text, annotations, references, and states create hierarchy through scale, spacing, position, and rhythm.\n@cue Text, traces of attention, and whitespace form the interface.\n@length 520\n---\nA long article should retain a sense of its full volume while width and height remain free to trade places under approximately the same territory weight. Length determines area, not column span.\n@length 2800\n---\nHighlights, notes, and AI explanations become visible cues inside the source territory rather than separate cards.\n@cue Processing changes what becomes visible, not the source area.\n@length 700\n---\nPanorama compresses whitespace while preserving grouping, hierarchy, adjacency, and representative cues.\n@length 900\n---\nA Page begins with selection, arrangement, and writing. References preserve source identity instead of quietly becoming original prose.\n@length 420\n---\nFull-width is a geometric option, not a reward for importance or length. A short block may become wide and shallow; a long block may become narrow and tall.\n@length 1500\n---\nSequence numbers separate reading order from placement, allowing whitespace without losing direction.\n@length 260\n---\nLocal reflow should preserve spatial memory. New candidates replace old placements only when the improvement is meaningful.\n@pin right\n@length 580`;const W={move:80,edge:48,fragment:38,line:35,balance:24,fullrun:44,area:70};let weights={...W},entries=[],cands=[],selected=0,previous=new Map();const $=id=>document.getElementById(id);$('src').value=SAMPLE;for(let i=0;i<COLS;i++)$('gridlines').appendChild(document.createElement('i'));function parse(t){return t.split(/\n\s*---\s*\n/).map((c,i)=>{let cue='',pin=null,len=null,b=[];c.trim().split(/\n/).forEach(x=>{if(/^@cue\s+/i.test(x))cue=x.replace(/^@cue\s+/i,'');else if(/^@pin\s+/i.test(x))pin=x.replace(/^@pin\s+/i,'').trim();else if(/^@length\s+/i.test(x))len=+x.replace(/^@length\s+/i,'');else b.push(x)});let body=b.join(' ').trim();if(!body)return null;let chars=len||body.length,target=Math.max(20,Math.min(84,Math.round(16+Math.sqrt(chars)*1.08)));return{id:i+1,body,cue,pin,chars,target}}).filter(Boolean)}function rowsFor(e,span){return Math.max(5,Math.round(e.target/span))}function overlap(a,b){return !(a.x+a.span<=b.x||b.x+b.span<=a.x||a.row+a.rows<=b.row||b.row+b.rows<=a.row)}function placementsFor(e,state){let out=[];for(let span=2;span<=COLS;span++){if(span===6&&!$('full').checked)continue;let rows=rowsFor(e,span);for(let row=state.cursor;row<=state.cursor+18;row++)for(let x=0;x<=COLS-span;x++){let p={id:e.id,x,row,span,rows};if(state.ps.some(q=>overlap(p,q)))continue;if(e.pin==='left'&&x>1)continue;if(e.pin==='right'&&x+span<COLS-1)continue;out.push(p)}}return out.slice(0,36)}function metric(ps){let area=0,edge=0,line=0,balance=0,fullrun=0,move=0;let mass=0,mx=0;ps.forEach((p,i)=>{let e=entries[i],actual=p.span*p.rows;area+=Math.abs(actual-e.target)/e.target*100;let left=p.x===0,right=p.x+p.span===COLS;if(!left&&!right)edge+=24;let ideal=e.chars>1500?4.5:e.chars>700?4:e.chars>300?3.3:2.8;line+=Math.abs(p.span-ideal)*11;let m=actual;mass+=m;mx+=(p.x+p.span/2)*m;let prev=previous.get(p.id);if(prev)move+=(Math.abs(prev.x-p.x)*9+Math.abs(prev.row-p.row)*1.2+Math.abs(prev.span-p.span)*5)});for(let i=1;i<ps.length;i++)if(ps[i].span===6&&ps[i-1].span===6)fullrun+=35;balance=mass?Math.abs(mx/mass-3)*13:0;let maxRow=Math.max(...ps.map(p=>p.row+p.rows));let occupied=ps.reduce((s,p)=>s+p.span*p.rows,0),box=Math.max(1,maxRow*COLS),fragment=Math.max(0,(1-occupied/box)*28-5);return{area:area/ps.length,edge:edge/ps.length,line:line/ps.length,balance,fullrun,move:move/ps.length,fragment}}function score(m){let sw=0,s=0;Object.keys(W).forEach(k=>{sw+=weights[k];s+=m[k]*weights[k]});return s/sw}function generate(){let beam=[{i:0,cursor:0,ps:[]}],bw=64;while(beam.some(s=>s.i<entries.length)){let next=[];for(let st of beam){if(st.i>=entries.length){next.push(st);continue}let e=entries[st.i];for(let p of placementsFor(e,st)){let ps=[...st.ps,p],cursor=Math.max(st.cursor,Math.min(...ps.filter(q=>q.row+p.rows>=p.row).map(q=>q.row)));next.push({i:st.i+1,cursor:Math.max(cursor,p.row),ps})}}next.forEach(s=>{s.m=metric(s.ps);s.s=score(s.m)});next.sort((a,b)=>a.s-b.s);beam=next.slice(0,bw)}cands=beam.filter(s=>s.i===entries.length).sort((a,b)=>a.s-b.s).slice(0,+$('count').value);selected=0;render()}function render(){if(!cands.length)return;let c=cands[selected],L=$('layout');L.querySelectorAll('.block').forEach(n=>n.remove());L.classList.toggle('showgrid',$('grid').checked);L.classList.toggle('debug',$('debug').checked);let maxRow=Math.max(...c.ps.map(p=>p.row+p.rows))+4;L.style.height=(maxRow*U)+'px';c.ps.forEach((p,i)=>{let e=entries[i],d=document.createElement('article');d.className='block';d.style.left=`calc(${p.x/COLS*100}% + ${p.x?G/2:0}px)`;d.style.width=`calc(${p.span/COLS*100}% - ${p.x?G/2:0}px)`;d.style.top=(p.row*U)+'px';d.style.height=(p.rows*U)+'px';let lines=Math.max(2,Math.floor((p.rows*U-38)/22));d.innerHTML=`<div class="meta">${p.span}×${p.rows} / area ${p.span*p.rows} / target ${e.target}</div><div class="body" style="-webkit-line-clamp:${lines}">${e.body}</div>${e.cue?`<div class="cue">${e.cue}</div>`:''}<div class="seq">${String(e.id).padStart(2,'0')}</div>`;L.appendChild(d)});$('meta').textContent=`${entries.length} entries / candidate ${selected+1}`;$('stats').textContent=Object.entries(c.m).map(([k,v])=>`${k}: ${v.toFixed(1)} × ${weights[k]}`).join('\n')+`\nscore: ${c.s.toFixed(2)}`;let C=$('candidates');C.innerHTML='';cands.forEach((x,i)=>{let b=document.createElement('button');b.className='candidate'+(i===selected?' active':'');b.textContent=`#${i+1} · ${x.s.toFixed(1)}`;b.onclick=()=>{selected=i;render()};C.appendChild(b)})}function apply(preserve=true){if(preserve&&cands[0]){previous=new Map(cands[selected].ps.map(p=>[p.id,p]))}else previous=new Map();entries=parse($('src').value);generate()}function weightUI(){let h=$('weights');h.innerHTML='';Object.keys(W).forEach(k=>{let d=document.createElement('label');d.className='w';d.innerHTML=`<span>${k}</span><input type="range" min="0" max="120" value="${weights[k]}"><output>${weights[k]}</output>`;let r=d.querySelector('input'),o=d.querySelector('output');r.oninput=()=>{weights[k]=+r.value;o.value=r.value;generate()};h.appendChild(d)})}function randomize(){let s=['Spatial position can become part of memory.','Whitespace is pacing rather than waste.','A long block may become wide and shallow without changing its territory weight.','Sequence separates reading order from placement.','Processed traces should surface inside source text.','Local reflow should preserve earlier spatial memory.','A full-width shape is only one legal geometry.','Panorama compresses scale without erasing relationships.'];$('src').value=Array.from({length:8},()=>s[Math.floor(Math.random()*s.length)]+' '+s[Math.floor(Math.random()*s.length)]+(Math.random()>.6?'\n@length '+[260,520,900,1600,2800][Math.floor(Math.random()*5)]:'')).join('\n---\n');apply(false)}$('apply').onclick=()=>apply(true);$('reset').onclick=()=>{$('src').value=SAMPLE;apply(false)};$('random').onclick=randomize;$('full').onchange=generate;$('grid').onchange=render;$('debug').onchange=render;$('count').onchange=generate;weightUI();apply(false)})();</script></body></html>
