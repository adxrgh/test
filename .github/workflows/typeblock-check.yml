name: TypeBlock Check

on:
  push:
    paths:
      - "typeblock-editorial-ai-lab/**"
      - ".github/workflows/typeblock-check.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typeblock-editorial-ai-lab
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: typeblock-editorial-ai-lab/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check browser modules and editorial index solver
        run: npm run check
