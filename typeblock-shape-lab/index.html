<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TypeBlock Shape Lab</title>
<style>
:root{--bg:#ecece7;--paper:#fbfbf7;--ink:#111;--muted:#777;--line:#c9c9c1;--sig:#ff4b00}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Helvetica Neue,Arial,sans-serif}.app{max-width:1100px;margin:auto;padding:16px;display:grid;grid-template-columns:330px 1fr;gap:22px}.head{grid-column:1/-1;border-bottom:4px solid;padding:8px 0 14px;display:flex;justify-content:space-between;align-items:end}.head h1{margin:0;font-size:30px;line-height:.9;letter-spacing:-.05em}.head small{color:var(--muted)}.side{position:sticky;top:10px;max-height:calc(100vh - 20px);overflow:auto}.p{border-top:1px solid;padding:10px 0}.p h2{font-size:12px;margin:0 0 8px}textarea{width:100%;min-height:150px;border:1px solid;border-radius:0;padding:8px;font:12px/1.45 inherit}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}button{border:0;border-bottom:1px solid;background:none;padding:3px 0;font-weight:700}.opts{display:flex;gap:12px;flex-wrap:wrap;font-size:11px}.weights{display:grid;gap:6px}.w{display:grid;grid-template-columns:1fr 90px 26px;gap:6px;font-size:11px;align-items:center}.w input{width:100%}.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.ladder div{border-top:1px solid var(--line);padding-top:4px;font-size:9px;color:var(--muted)}.ladder b{display:block;color:var(--ink);font-size:10px}.stage{background:var(--paper);border:1px solid;overflow:hidden}.stagehead{position:sticky;top:0;z-index:9;background:#fbfbf7ee;border-bottom:1px solid;padding:10px 12px;display:flex;justify-content:space-between}.stagehead span{font-size:9px;color:var(--muted)}#layout{position:relative;min-height:800px;background-image:linear-gradient(to bottom,transparent 7px,#11111109 8px);background-size:100% 8px}.grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(6,1fr);gap:12px;opacity:0;pointer-events:none}.showgrid .grid{opacity:1}.grid i{border-left:1px solid #ff4b0040}.block{position:absolute;padding:7px 9px;overflow:hidden;cursor:pointer}.bounds .block{outline:1px solid #ff4b0060}.block.focus{outline:2px solid var(--sig);outline-offset:-2px}.body{font-size:13.5px;line-height:1.45;font-weight:560;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}.dom .body{font-size:18px;line-height:1.32;font-weight:760;letter-spacing:-.02em}.seq{position:absolute;left:0;bottom:0;font-size:60px;line-height:.72;font-weight:800;color:#1111;letter-spacing:-.07em}.meta{font-size:7px;color:var(--muted);letter-spacing:.06em;margin-bottom:5px}.cue{font:italic 10px/1.4 Georgia,serif;color:#555;margin-top:6px}.clean .meta{display:none}.cands{display:flex;gap:8px;overflow:auto;padding:9px 0}.cand{border:1px solid var(--line);padding:6px 8px;font-size:10px;white-space:nowrap}.cand.on{border-color:var(--sig);color:var(--sig)}.ins{font-size:10px}.sum{color:var(--muted);line-height:1.4;margin-bottom:6px}.shape{display:grid;grid-template-columns:42px 1fr 34px;gap:6px;padding:6px 0;border-top:1px solid var(--line);align-items:center}.shape.on{border-top:2px solid var(--sig)}.shape b{font-size:10px}.shape small{display:block;color:var(--muted);line-height:1.3}.score{text-align:right;font-weight:800}.stats{font-size:10px;color:var(--muted);white-space:pre-wrap;border-top:1px solid var(--line);padding-top:8px}@media(max-width:760px){.app{display:flex;flex-direction:column;padding:10px}.side{position:static;max-height:none;order:2}.main{order:1}.head{order:0}.ladder{grid-template-columns:repeat(2,1fr)}}
</style>
<div class="app" id="app"><header class="head"><h1>TypeBlock<br>Shape Lab</h1><small>area fixed → shape scored</small></header><aside class="side"><div class="p"><h2>Article sizes</h2><div class="ladder" id="ladder"></div></div><div class="p"><h2>Content</h2><textarea id="src"></textarea><div class="row"><button id="apply">Apply</button><button id="reset">Reset</button></div></div><div class="p"><h2>Weights</h2><div class="weights" id="weights"></div></div><div class="p"><h2>Options</h2><div class="opts"><label><input id="full" type="checkbox" checked>6-col</label><label><input id="clean" type="checkbox">clean</label><label><input id="grid" type="checkbox">grid</label><label><input id="bounds" type="checkbox">bounds</label></div></div><div class="p ins"><h2>Shape decision</h2><div class="sum" id="sum">Click a block to compare 2–6 column shapes.</div><div id="shapes"></div></div></aside><main class="main"><div class="stage"><div class="stagehead"><b>Typeblock / Layout</b><span id="meta"></span></div><div id="layout"><div class="grid" id="gridlines"></div></div></div><div class="cands" id="cands"></div><div class="stats" id="stats"></div></main></div>
<script>(()=>{'use strict';const C=6,U=8,G=12,BAND=64;const LENS=[60,180,420,900,1800,3600,7200,12000];const T=['Spatial position becomes part of memory when a layout remains stable enough to be learned.','Whitespace is pacing rather than waste. Complete open fields create structure while tiny accidental holes create noise.','Sequence numbers separate reading order from placement, allowing asymmetry without confusion.','Processed traces stay inside source territory. Highlights, notes, and AI explanations replace ordinary projection text.','A Page begins with selection, arrangement, and writing while references preserve source identity.','Panorama changes density rather than identity, preserving grouping, adjacency, order, and representative cues.','Area and shape are separate variables. Source length determines territory weight while layout chooses width and height.','Local reflow should preserve spatial memory and respect earlier anchors.'];function art(i,n){let s='';while(s.length<n)s+=(s?' In practice, ':'')+T[(i+s.length)%T.length];return s.slice(0,n)}function sample(){return LENS.map((n,i)=>art(i,n)+(i===2?'\n@cue Processing changes visibility, not source identity.':'')+(i===5?'\n@pin right':'')).join('\n---\n')}const SAMPLE=sample();const W={shape:92,area:80,composition:72,axes:58,white:64,move:80};let w={...W},E=[],K=[],sel=0,prev=new Map(),focus=null;const $=x=>document.getElementById(x);$('src').value=SAMPLE;for(let i=0;i<C;i++)$('gridlines').appendChild(document.createElement('i'));function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function target(n){return clamp(Math.round(10+Math.sqrt(n)*1.46),18,170)}function parse(s){return s.split(/\n\s*---\s*\n/).map((c,i)=>{let cue='',pin=null,b=[];c.trim().split(/\n/).forEach(x=>{if(/^@cue /i.test(x))cue=x.replace(/^@cue /i,'');else if(/^@pin /i.test(x))pin=x.replace(/^@pin /i,'').trim();else b.push(x)});let body=b.join(' ').trim();return body?{id:i+1,body,cue,pin,chars:body.length,target:target(body.length)}:null}).filter(Boolean)}function rows(e,span){return Math.max(4,Math.round(e.target/span))}function ov(a,b){return !(a.x+a.span<=b.x||b.x+b.span<=a.x||a.row+a.rows<=b.row||b.row+b.rows<=a.row)}function voice(s){return s<=2?'Narrow / Note':s===3?'Column / Reading':s===4?'Body / Neutral':s===5?'Wide / Editorial':'Statement / Horizontal'}function intrinsic(e,p){let Wd=Math.max(360,$('layout').clientWidth||720),cw=(Wd-G*5)/6,px=cw*p.span+G*(p.span-1),hp=p.rows*U,cpl=Math.max(8,px/7.15),lc=Math.max(2,Math.floor((hp-18-(e.cue?34:0))/20)),cap=Math.max(1,cpl*lc),fill=Math.min(1,e.chars/cap),line=cpl<34?(34-cpl)*1.7:cpl>72?(cpl-72)*1.35:0,fc=fill<.55?(.55-fill)*155:fill<.72?(.72-fill)*24:0,asp=px/hp,ac=asp<.72?(.72-asp)*30:asp>5.4?(asp-5.4)*8:0;return{intrinsic:clamp(line+fc+ac,0,100),fill,cpl,asp,line,fc,ac}}function context(p,st){let r=st.ps.slice(-4),axis=20;if(r.some(q=>q.x===p.x))axis-=11;if(r.some(q=>q.x+q.span===p.x+p.span))axis-=6;if(p.x===0||p.x+p.span===6)axis-=5;axis=Math.max(0,axis);let rep=0;if(r.at(-1)?.span===p.span)rep+=7;if(r.at(-2)?.span===p.span&&r.at(-1)?.span===p.span)rep+=14;let edge=(p.x===0||p.x+p.span===6)?0:12;return{context:clamp(axis+rep+edge,0,100),axis,rep,edge}}function stability(e,p){let q=prev.get(e.id);if(!q)return{stability:0};return{stability:clamp(Math.abs(q.x-p.x)*14+Math.abs(q.row-p.row)*.9+Math.abs(q.span-p.span)*10,0,100)}}function breakdown(e,p,st){let a=intrinsic(e,p),b=context(p,st),c=stability(e,p);return{...a,...b,...c,total:(5*a.intrinsic+3*b.context+8*c.stability)/16,voice:voice(p.span)}}function places(e,st){let o=[];for(let sp=2;sp<=6;sp++){if(sp===6&&!$('full').checked)continue;let rr=rows(e,sp);for(let row=st.cursor;row<=st.cursor+18;row++)for(let x=0;x<=6-sp;x++){let p={id:e.id,x,row,span:sp,rows:rr};if(st.ps.some(q=>ov(p,q)))continue;if(e.pin==='right'&&x+sp<5)continue;p.shape=breakdown(e,p,st);o.push(p)}}return o.sort((a,b)=>a.shape.total-b.shape.total).slice(0,36)}function intersect(p,a,b){return Math.max(0,Math.min(p.row+p.rows,b)-Math.max(p.row,a))}function viewport(ps){let max=Math.max(...ps.map(p=>p.row+p.rows)),comp=0,axes=0,white=0,n=0;for(let s=0;s<max;s+=48){let a=ps.map(p=>({p,m:intersect(p,s,s+BAND)*p.span})).filter(x=>x.m>0);if(!a.length)continue;n++;a.sort((x,y)=>y.m-x.m);if(a.length===1)comp+=30;if(a.length>3)comp+=(a.length-3)*14;if(a.length>1){let r=a[0].m/a[1].m;if(r<1.25)comp+=(1.25-r)*70}let xs=new Map;a.forEach(x=>xs.set(x.p.x,(xs.get(x.p.x)||0)+1));let cv=[...xs.values()].sort((x,y)=>y-x).slice(0,2).reduce((x,y)=>x+y,0);axes+=(1-cv/a.length)*60+Math.max(0,xs.size-3)*12;let occ=a.reduce((z,x)=>z+x.m,0)/(BAND*6);white+=occ>.78?(occ-.78)*120:occ<.40?(.40-occ)*40:0}return{composition:comp/Math.max(1,n),axes:axes/Math.max(1,n),white:white/Math.max(1,n)}}function metrics(ps){let area=0,shape=0,move=0;ps.forEach((p,i)=>{let e=E[i],ac=p.span*p.rows;area+=Math.abs(ac-e.target)/e.target*100;shape+=p.shape?.total||0;let q=prev.get(p.id);if(q)move+=Math.abs(q.x-p.x)*9+Math.abs(q.row-p.row)*1.2+Math.abs(q.span-p.span)*5});return{area:area/ps.length,shape:shape/ps.length,move:move/ps.length,...viewport(ps)}}function score(m){let s=0,z=0;for(let k in W){s+=m[k]*w[k];z+=w[k]}return s/z}function gen(){let beam=[{i:0,cursor:0,ps:[]}];while(beam.some(s=>s.i<E.length)){let nx=[];for(let st of beam){if(st.i>=E.length){nx.push(st);continue}for(let p of places(E[st.i],st)){let ps=[...st.ps,p];nx.push({i:st.i+1,cursor:Math.max(st.cursor,p.row),ps})}}nx.forEach(s=>{s.m=metrics(s.ps);s.s=score(s.m)});beam=nx.sort((a,b)=>a.s-b.s).slice(0,72)}K=beam.filter(s=>s.i===E.length).sort((a,b)=>a.s-b.s).slice(0,8);sel=0;render()}function dom(ps){let ids=new Set,max=Math.max(...ps.map(p=>p.row+p.rows));for(let s=0;s<max;s+=BAND){let a=ps.map(p=>({p,m:intersect(p,s,s+BAND)*p.span})).filter(x=>x.m>0).sort((x,y)=>y.m-x.m);if(a[0]&&(a.length===1||a[0].m/(a[1]?.m||1)>1.2))ids.add(a[0].p.id)}return ids}function alts(i,ps){let e=E[i],prior=ps.slice(0,i),st={ps:prior,cursor:prior.length?Math.max(...prior.map(q=>q.row)):0},out=[];for(let sp=2;sp<=6;sp++){if(sp===6&&!$('full').checked)continue;let best=null,rr=rows(e,sp);for(let row=st.cursor;row<=st.cursor+18;row++)for(let x=0;x<=6-sp;x++){let p={id:e.id,x,row,span:sp,rows:rr};if(prior.some(q=>ov(p,q)))continue;p.shape=breakdown(e,p,st);if(!best||p.shape.total<best.shape.total)best=p}if(best)out.push(best)}return out}function inspect(id,ps){focus=id;let i=E.findIndex(e=>e.id===id),e=E[i],p=ps[i];$('sum').innerHTML=`<b>${String(id).padStart(2,'0')}</b> · ${e.chars.toLocaleString()} chars · target ${e.target} · chosen <b>${p.span}×${p.rows}</b> · ${voice(p.span)}`;$('shapes').innerHTML='';alts(i,ps).forEach(q=>{let m=q.shape,d=document.createElement('div');d.className='shape'+(q.span===p.span?' on':'');d.innerHTML=`<b>${q.span} col</b><div><b>${m.voice}</b><small>${q.span}×${q.rows} · intrinsic ${m.intrinsic.toFixed(1)} · context ${m.context.toFixed(1)} · stability ${m.stability.toFixed(1)}<br>fill ${(m.fill*100).toFixed(0)}% · line ${m.cpl.toFixed(0)} chars · aspect ${m.asp.toFixed(2)}</small></div><div class=score>${m.total.toFixed(1)}</div>`;$('shapes').appendChild(d)})}function render(){if(!K.length)return;let k=K[sel],L=$('layout'),D=dom(k.ps);L.querySelectorAll('.block').forEach(x=>x.remove());L.classList.toggle('showgrid',$('grid').checked);L.classList.toggle('bounds',$('bounds').checked);$('app').classList.toggle('clean',$('clean').checked);L.style.height=(Math.max(...k.ps.map(p=>p.row+p.rows))+5)*U+'px';k.ps.forEach((p,i)=>{let e=E[i],d=document.createElement('article'),is=D.has(p.id);d.className='block'+(is?' dom':'')+(focus===p.id?' focus':'');d.style.left=`calc(${p.x/6*100}% + ${p.x?G/2:0}px)`;d.style.width=`calc(${p.span/6*100}% - ${p.x?G/2:0}px)`;d.style.top=p.row*U+'px';d.style.height=p.rows*U+'px';let lp=is?24:20,lines=Math.max(2,Math.floor((p.rows*U-($('clean').checked?8:26)-(e.cue?36:0))/lp));d.innerHTML=`<div class=meta>${e.chars.toLocaleString()} chars · ${p.span}×${p.rows} · shape ${p.shape.total.toFixed(1)}</div><div class=body style="-webkit-line-clamp:${lines}">${e.body}</div>${e.cue?`<div class=cue>${e.cue}</div>`:''}<div class=seq>${String(e.id).padStart(2,'0')}</div>`;d.onclick=()=>{focus=p.id;render();inspect(p.id,k.ps)};L.appendChild(d)});$('meta').textContent=`${E.length} articles · candidate ${sel+1}`;$('cands').innerHTML='';K.forEach((x,i)=>{let b=document.createElement('button');b.className='cand'+(i===sel?' on':'');b.textContent=`#${i+1} · ${x.s.toFixed(1)}`;b.onclick=()=>{sel=i;render()};$('cands').appendChild(b)});$('stats').textContent=Object.entries(k.m).map(([a,b])=>`${a}: ${b.toFixed(1)} × ${w[a]}`).join('\n')+`\nscore ${k.s.toFixed(2)}`;if(focus)inspect(focus,k.ps)}function ladder(){let h=$('ladder');h.innerHTML='';E.forEach(e=>{let d=document.createElement('div');d.innerHTML=`<b>${String(e.id).padStart(2,'0')} · ${e.chars.toLocaleString()}</b>target ${e.target}`;h.appendChild(d)})}function apply(p=true){if(p&&K[sel])prev=new Map(K[sel].ps.map(q=>[q.id,q]));else prev=new Map;E=parse($('src').value);ladder();gen()}function wui(){for(let k in W){let l=document.createElement('label');l.className='w';l.innerHTML=`<span>${k}</span><input type=range min=0 max=120 value=${w[k]}><output>${w[k]}</output>`;let r=l.querySelector('input'),o=l.querySelector('output');r.oninput=()=>{w[k]=+r.value;o.value=r.value;gen()};$('weights').appendChild(l)}}$('apply').onclick=()=>apply(true);$('reset').onclick=()=>{$('src').value=SAMPLE;apply(false)};$('full').onchange=gen;$('clean').onchange=render;$('grid').onchange=render;$('bounds').onchange=render;wui();apply(false)})();</script>
