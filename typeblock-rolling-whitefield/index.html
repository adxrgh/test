<div class="app" id="app"><header class="head"><h1>TypeBlock<br>Shape Lab</h1><small>area fixed → shape scored → rolling viewports</small></header><aside class="side"><div class="p"><h2>Article sizes</h2><div class="ladder" id="ladder"></div></div><div class="p"><h2>Content</h2><textarea id="src"></textarea><div class="row"><button id="apply">Apply</button><button id="reset">Reset</button></div></div><div class="p"><h2>Weights</h2><div class="weights" id="weights"></div></div><div class="p"><h2>Options</h2><div class="opts"><label><input id="full" type="checkbox" checked>6-col</label><label><input id="clean" type="checkbox">clean</label><label><input id="grid" type="checkbox">grid</label><label><input id="bounds" type="checkbox">bounds</label><label><input id="worst" type="checkbox" checked>worst viewport</label></div></div><div class="p"><h2>Rolling viewport</h2><div class="rollsum" id="rollsum">Scanning the full scroll path…</div></div><div class="p ins"><h2>Shape decision</h2><div class="sum" id="sum">Click a block to compare 2–6 column shapes.</div><div id="shapes"></div></div></aside><main class="main"><div class="stage"><div class="stagehead"><b>Typeblock / Layout</b><span id="meta"></span></div><div id="layout"><div class="grid" id="gridlines"></div></div></div><div class="cands" id="cands"></div><div class="stats" id="stats"></div></main></div>
<script>(()=>{'use strict';
const C=6,U=8,G=12;
const LENS=[60,180,420,900,1800,3600,7200,12000];
const T=['Spatial position becomes part of memory when a layout remains stable enough to be learned.','Whitespace is pacing rather than waste. Complete open fields create structure while tiny accidental holes create noise.','Sequence numbers separate reading order from placement, allowing asymmetry without confusion.','Processed traces stay inside source territory. Highlights, notes, and AI explanations replace ordinary projection text.','A Page begins with selection, arrangement, and writing while references preserve source identity.','Panorama changes density rather than identity, preserving grouping, adjacency, order, and representative cues.','Area and shape are separate variables. Source length determines territory weight while layout chooses width and height.','Local reflow should preserve spatial memory and respect earlier anchors.'];
function art(i,n){let s='';while(s.length<n)s+=(s?' In practice, ':'')+T[(i+s.length)%T.length];return s.slice(0,n)}
function sample(){return LENS.map((n,i)=>art(i,n)+(i===2?'\n@cue Processing changes visibility, not source identity.':'')+(i===5?'\n@pin right':'')).join('\n---\n')}
const SAMPLE=sample();

function intrinsic(e,p){let Wd=Math.max(360,$('layout').clientWidth||720),cw=(Wd-G*5)/6,px=cw*p.span+G*(p.span-1),hp=p.rows*U,cpl=Math.max(8,px/7.15),lc=Math.max(2,Math.floor((hp-18-(e.cue?34:0))/20)),cap=Math.max(1,cpl*lc),fill=Math.min(1,e.chars/cap),line=cpl<34?(34-cpl)*1.7:cpl>72?(cpl-72)*1.35:0,fc=fill<.55?(.55-fill)*155:fill<.72?(.72-fill)*24:0,asp=px/hp,ac=asp<.72?(.72-asp)*30:asp>5.4?(asp-5.4)*8:0;return{intrinsic:clamp(line+fc+ac,0,100),fill,cpl,asp,line,fc,ac}}
function context(p,st){let r=st.ps.slice(-4),axis=20;if(r.some(q=>q.x===p.x))axis-=11;if(r.some(q=>q.x+q.span===p.x+p.span))axis-=6;if(p.x===0||p.x+p.span===6)axis-=5;axis=Math.max(0,axis);let rep=0;if(r.at(-1)?.span===p.span)rep+=7;if(r.at(-2)?.span===p.span&&r.at(-1)?.span===p.span)rep+=14;let edge=(p.x===0||p.x+p.span===6)?0:12;return{context:clamp(axis+rep+edge,0,100),axis,rep,edge}}function stability(e,p){let q=prev.get(e.id);if(!q)return{stability:0};return{stability:clamp(Math.abs(q.x-p.x)*14+Math.abs(q.row-p.row)*.9+Math.abs(q.span-p.span)*10,0,100)}}function breakdown(e,p,st){let a=intrinsic(e,p),b=context(p,st),c=stability(e,p);return{...a,...b,...c,total:(5*a.intrinsic+3*b.context+8*c.stability)/16,voice:voice(p.span)}}
function places(e,st){let o=[];for(let sp=2;sp<=6;sp++){if(sp===6&&!$('full').checked)continue;let rr=rows(e,sp);for(let row=st.cursor;row<=st.cursor+18;row++)for(let x=0;x<=6-sp;x++){let p={id:e.id,x,row,span:sp,rows:rr};if(st.ps.some(q=>ov(p,q)))continue;if(e.pin==='right'&&x+sp<5)continue;p.shape=breakdown(e,p,st);o.push(p)}}return o.sort((a,b)=>a.shape.total-b.shape.total).slice(0,30)}
function intersect(p,a,b){return Math.max(0,Math.min(p.row+p.rows,b)-Math.max(p.row,a))}
function windowStarts(ps,V){let max=Math.max(...ps.map(p=>p.row+p.rows)),last=Math.max(0,max-V),step=Math.max(12,Math.round(V/4)),set=new Set([0,last]);for(let s=0;s<=last;s+=step)set.add(clamp(Math.round(s),0,last));for(let p of ps){[p.row,p.row+p.rows,p.row-V,p.row+p.rows-V].forEach(s=>set.add(clamp(Math.round(s),0,last)))}return [...set].sort((a,b)=>a-b)}
function occupancyGrid(ps,start,V){let g=Array.from({length:V},()=>Array(C).fill(0));for(let p of ps){let y0=Math.max(start,p.row),y1=Math.min(start+V,p.row+p.rows);if(y1<=y0)continue;for(let y=y0;y<y1;y++)for(let x=p.x;x<p.x+p.span;x++)g[y-start][x]=1}return g}
function whiteComponents(grid){let H=grid.length,Wd=C,seen=Array.from({length:H},()=>Array(Wd).fill(false)),out=[];const dirs=[[1,0],[-1,0],[0,1],[0,-1]];for(let y=0;y<H;y++)for(let x=0;x<Wd;x++){if(grid[y][x]||seen[y][x])continue;let q=[[x,y]],k=0,cells=[],minx=x,maxx=x,miny=y,maxy=y,lat=false,edge=false;seen[y][x]=true;while(k<q.length){let [cx,cy]=q[k++];cells.push([cx,cy]);minx=Math.min(minx,cx);maxx=Math.max(maxx,cx);miny=Math.min(miny,cy);maxy=Math.max(maxy,cy);if(cx===0||cx===Wd-1)lat=true;if(cx===0||cx===Wd-1||cy===0||cy===H-1)edge=true;for(let [dx,dy] of dirs){let nx=cx+dx,ny=cy+dy;if(nx>=0&&nx<Wd&&ny>=0&&ny<H&&!grid[ny][nx]&&!seen[ny][nx]){seen[ny][nx]=true;q.push([nx,ny])}}}let bw=maxx-minx+1,bh=maxy-miny+1,area=cells.length,bbox=bw*bh;out.push({area,bw,bh,lat,edge,ragged:bbox?1-area/bbox:0,cells})}return out.sort((a,b)=>b.area-a.area)}
function whiteField(ps,start,V){let grid=occupancyGrid(ps,start,V),comps=whiteComponents(grid),total=C*V,white=comps.reduce((s,c)=>s+c.area,0),occ=1-white/total,largest=comps[0]||{area:0,bw:0,bh:0,lat:false,ragged:0,cells:[]},largestRatio=largest.area/total,small=comps.filter(c=>c.area/total<.03),smallArea=small.reduce((s,c)=>s+c.area,0)/total,slivers=comps.filter(c=>(c.bw===1&&c.bh>=V*.18)||(c.bh<=2&&c.bw>=3)),missing=largestRatio<.16?(.16-largestRatio)*190:largestRatio>.58?(largestRatio-.58)*55:0,fragment=small.length*3.5+smallArea*95+Math.max(0,comps.length-5)*2.5,sliver=slivers.length*8,ragged=largest.ragged*24,occupancy=occ>.80?(occ-.80)*145:occ<.34?(.34-occ)*55:0,edgeBonus=largest.lat?7:0,cost=clamp(missing+fragment+sliver+ragged+occupancy-edgeBonus,0,100);return{cost,largestRatio,components:comps.length,smallCount:small.length,sliverCount:slivers.length,occ,largest,grid}}
function compAxes(ps,start,V){let a=ps.map(p=>({p,m:intersect(p,start,start+V)*p.span})).filter(x=>x.m>0);if(!a.length)return{composition:80,axes:80,count:0,dominant:null};a.sort((x,y)=>y.m-x.m);let comp=0;if(a.length===1)comp+=10;if(a.length>3)comp+=(a.length-3)*14;if(a.length>1){let r=a[0].m/a[1].m;if(r<1.25)comp+=(1.25-r)*70}let xs=new Map;a.forEach(x=>xs.set(x.p.x,(xs.get(x.p.x)||0)+1));let cv=[...xs.values()].sort((x,y)=>y-x).slice(0,2).reduce((x,y)=>x+y,0),axes=(1-cv/a.length)*60+Math.max(0,xs.size-3)*12;return{composition:clamp(comp,0,100),axes:clamp(axes,0,100),count:a.length,dominant:a[0]?.p?.id||null}}
function rolling(ps){let V=viewportRows(),starts=windowStarts(ps,V),wins=[];for(let start of starts){let ca=compAxes(ps,start,V),wf=whiteField(ps,start,V),cost=(4*wf.cost+3*ca.composition+2*ca.axes)/9;wins.push({start,V,cost,...ca,wf})}let costs=wins.map(x=>x.cost),p90=percentile(costs,.90),avg=mean(costs),max=Math.max(0,...costs),rollingCost=.5*p90+.3*avg+.2*max,worst=wins.reduce((a,b)=>!a||b.cost>a.cost?b:a,null);return{rolling:rollingCost,p90,mean:avg,max,wins,worst,whiteField:mean(wins.map(x=>x.wf.cost)),composition:mean(wins.map(x=>x.composition)),axes:mean(wins.map(x=>x.axes))}}
function baseMetrics(ps){let area=0,shape=0,move=0;ps.forEach((p,i)=>{let e=E[i],ac=p.span*p.rows;area+=Math.abs(ac-e.target)/e.target*100;shape+=p.shape?.total||0;let q=prev.get(p.id);if(q)move+=Math.abs(q.x-p.x)*9+Math.abs(q.row-p.row)*1.2+Math.abs(q.span-p.span)*5});let r=rolling(ps);return{m:{area:area/ps.length,shape:shape/ps.length,move:move/ps.length,composition:r.composition,axes:r.axes,whiteField:r.whiteField,rolling:r.rolling},diag:r}}
function score(m){let s=0,z=0;for(let k in W){s+=(m[k]||0)*w[k];z+=w[k]}return s/z}
function quickScore(ps){let area=0,shape=0,move=0;ps.forEach((p,i)=>{let e=E[i],ac=p.span*p.rows;area+=Math.abs(ac-e.target)/e.target*100;shape+=p.shape?.total||0;let q=prev.get(p.id);if(q)move+=Math.abs(q.x-p.x)*9+Math.abs(q.row-p.row)*1.2+Math.abs(q.span-p.span)*5});let n=Math.max(1,ps.length);return((area/n)*w.area+(shape/n)*w.shape+(move/n)*w.move)/(w.area+w.shape+w.move)}

function dom(ps){let ids=new Set,V=viewportRows();for(let s of windowStarts(ps,V)){let a=ps.map(p=>({p,m:intersect(p,s,s+V)*p.span})).filter(x=>x.m>0).sort((x,y)=>y.m-x.m);if(a[0]&&(a.length===1||a[0].m/(a[1]?.m||1)>1.2))ids.add(a[0].p.id)}return ids}

function renderWorst(L,k){L.querySelectorAll('.worstband').forEach(n=>n.remove());if(!$('worst').checked||!k.diag?.worst)return;let d=document.createElement('div'),q=k.diag.worst;d.className='worstband';d.style.top=q.start*U+'px';d.style.height=q.V*U+'px';d.innerHTML=`<span>WORST · ${q.cost.toFixed(1)}</span>`;L.appendChild(d)}
